name: Quality
on:
  pull_request:
  # Manual Deploy fallback reuses this quality job.
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty checks the event commit)
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm policy:ci
        env:
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: pnpm policy:quality
